name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm run test
      # tsc + the bundle, which is committed: it must be the build of the committed js/
      - run: npm run build
      - run: git diff --exit-code src/specklewidgets/static

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src
      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: ~/.cache/bimpolars
          # The date of the bucket's data the known numbers are for, and what the tests fetch
          # beyond the Speckle objects: bump it with either, since a cache key is never
          # overwritten and fetch downloads only what is missing
          key: bimpolars-data-2026-10-30-arch-ifc
      # PROJ fetches the NSGI grids from cdn.proj.org, so that the tests of the heights of
      # PDOK's 3D Tiles run (tests/test_geo.py's grids fixture)
      # -rP for the live numbers of the pdok tests, until they are pinned
      - run: uv run pytest -rs -rP
        env:
          PROJ_NETWORK: "ON"

  e2e:
    runs-on: ubuntu-latest
    needs: [js, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: npm ci
      # The widget's esm.sh imports, crawled: every module answers, one build of each external
      - run: node e2e/esm-check.mjs
      - run: npx playwright install --with-deps chromium
      - run: uv sync --locked
      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: ~/.cache/bimpolars
          key: bimpolars-data-2026-10-30-arch-ifc
      # The real esm.sh, which the runners reach, rather than the mirror of node_modules
      - run: npm run e2e
        env:
          E2E_ESM_SH: network
      # The canvases (the live surroundings among them), or the page when a viewer never
      # reported
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: e2e/.out/
          if-no-files-found: ignore
