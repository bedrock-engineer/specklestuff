name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm at package.json's packageManager version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just setup-js
      - run: just check-js
      # tsc + the bundle, which is committed: it must be the build of the committed
      # packages/geospeckle-viewer
      - run: just check-bundle
      # The npm package's dist/ (not committed), as it would be published
      - run: just build-npm

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just setup-py
      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: ~/.cache/bimpolars
          # The date of the bucket's data the known numbers are for, and what the tests fetch
          # beyond the Speckle objects: bump it with either, since a cache key is never
          # overwritten and fetch downloads only what is missing
          key: bimpolars-data-2026-10-30-arch-ifc
      # PROJ fetches the NSGI grids from cdn.proj.org, so that the tests of the heights of
      # PDOK's 3D Tiles run (tests/test_geo.py's grids fixture)
      - run: just check-py
        env:
          PROJ_NETWORK: "ON"
