name: e2e

# The example notebooks and the demo page in headless Chromium (just e2e), 15 to 20 minutes.
# Pre-release this runs by hand, not on every PR: Actions > e2e > Run workflow, on any branch.
# Run it before a release and after changing how the widgets load or draw.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm at package.json's packageManager version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just setup
      - run: pnpm exec playwright install --with-deps chromium
      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: ~/.cache/bimpolars
          key: bimpolars-data-2026-10-30-arch-ifc
      - run: just e2e
      # The canvases (the live surroundings among them), or the page when a viewer never
      # reported
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: e2e/.out/
          if-no-files-found: ignore
