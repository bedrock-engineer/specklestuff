[project]
name = "specklewidgets"
version = "0.1.0"
description = "Speckle's web viewer in a notebook, fed with Speckle objects instead of a server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Joost Gevaert", email = "dev@joost.engineer" }]
keywords = ["speckle", "bim", "anywidget", "marimo", "jupyter", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.12"
dependencies = [
    "anywidget>=0.9",
    "traitlets>=5",
]

[project.urls]
Repository = "https://github.com/bedrock-engineer/specklestuff"
Issues = "https://github.com/bedrock-engineer/specklestuff/issues"

[project.optional-dependencies]
bim = [
    "specklepy>=2026.9.1",
]
# What bimpolars[geobim] adds: bimpolars itself is not on PyPI, so the BimDataFrame brings it
geo = [
    "pyproj>=3.7",
]
server = [
    "specklepy[bundle]>=2026.9.1",
]

[dependency-groups]
dev = [
    # with specklepy's bundle reader, for bimpolars.bundle_objects
    "bimpolars[speckle]",
    # the extras of the BimDataFrame intake, the surroundings and the server module, for their
    # tests and examples
    "specklewidgets[bim,geo,server]",
    "marimo>=0.17",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-shapely>=2",
    # the token field of examples/speckle_receive_send.py
    "wigglystuff>=0.5",
]
# The pytest suite without the example's data and notebook toolchain
test = [
    "pytest>=8.3",
]

[tool.uv.sources]
bimpolars = { git = "https://github.com/bedrock-engineer/bimpolars", branch = "main" }

# uv installs this repo as a path dependency in sandboxed notebooks and caches the built
# wheel; without these keys a JS rebuild (which only touches static/) never invalidates it
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/specklewidgets/**/*.py" },
    { file = "src/specklewidgets/static/*.js" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specklewidgets"]

[tool.hatch.build.targets.sdist]
exclude = ["/.claude", "/CLAUDE.md", "/CONTEXT.md", "/sandbox", "/e2e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to a real Speckle server with this machine's Speckle account; run with -m live",
]
addopts = "-m 'not live'"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["anywidget", "anywidget.*", "specklepy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["sandbox"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D", "W", "RUF"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D", "B018", "N803"]
