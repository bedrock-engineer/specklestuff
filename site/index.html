<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- From site/intro/<SITE>.html, filled in by vite.config.js: its h1 is the title, its
         intro the header's and its meta description the text that link previews show -->
    <title><!-- title --></title>
    <meta name="description" content="<!-- description -->" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="<!-- url -->" />
    <meta property="og:title" content="<!-- title -->" />
    <meta property="og:description" content="<!-- description -->" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="bar">
      <!-- Open beside each other, collapsed to the title when stacked: a tap opens it -->
      <details class="intro">
        <summary>
          <h1><!-- title --></h1>
        </summary>
        <!-- intro -->
      </details>
      <!-- The repository, beside the chevron rather than in the summary: in sight with the intro
           collapsed too, and a click on it never toggles the intro -->
      <a class="repo" href="<!-- repo -->" title="<!-- site --> on GitHub">
        <svg viewBox="0 0 16 16" aria-label="<!-- site --> on GitHub" role="img">
          <path
            fill="currentColor"
            d="M8 0c4.42 0 8 3.58 8 8a8.01 8.01 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A8 8 0 0 1 0 8c0-4.42 3.58-8 8-8Z"
          />
        </svg>
      </a>
      <script>
        // Before the first paint, so that the intro neither flashes on a phone nor pops in
        {
          const intro = document.querySelector(".intro");
          const sideBySide = matchMedia("(min-width: 901px)");
          intro.open = sideBySide.matches;
          sideBySide.addEventListener("change", () => (intro.open = sideBySide.matches));
        }
      </script>
    </header>
    <main class="panes">
      <!-- The side-by-side layout's instructions, a sentence split where the panes are -->
      <p class="how how-click">Click a BIM element</p>
      <p class="how how-see">to see its footprint on the map</p>
      <p class="how how-shift">Shift-click to select multiple</p>
      <section id="viewer-pane" class="pane" aria-label="3D view of the model">
        <div id="viewer"></div>
        <!-- Until the model is in: a still of the view (still-3d.webp), faded under the message -->
        <div id="loading" class="loading"><p>Loading the structural model…</p></div>
      </section>
      <div
        id="splitter"
        class="splitter"
        role="separator"
        tabindex="0"
        aria-orientation="vertical"
        aria-controls="viewer-pane map-pane"
        aria-label="Width of the 3D view and the map"
        title="Drag to resize; double-click to reset"
      ></div>
      <section id="map-pane" class="pane" aria-label="Footprint map">
        <div id="map"></div>
        <div class="basemaps" role="group" aria-label="Basemap">
          <button type="button" data-basemap="topographic" aria-pressed="true">Topographic</button>
          <button type="button" data-basemap="aerial" aria-pressed="false">Aerial photo</button>
        </div>
        <!-- Empty, and so out of sight, until something is selected -->
        <aside id="selection" class="card" aria-live="polite" data-ids="[]" data-drawn="[]"></aside>
      </section>
      <!-- The stacked layout's: the strip where a swipe scrolls the page, the panes take the
           touches for the camera and the map -->
      <aside class="rail">
        <p>Tap a BIM element to see its footprint on the map</p>
        <p>Swipe here to scroll</p>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
