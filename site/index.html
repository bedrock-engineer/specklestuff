<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- VITE_SITE_TITLE: site/.env has specklestuff's, bimpolars' Pages workflow sets its own -->
    <title>%VITE_SITE_TITLE%</title>
    <meta
      name="description"
      content="The structural model of Sixty5, a tower at Strijp-S in Eindhoven, read from IFC and converted to geodata with bimpolars, in specklestuff's GeoSpeckleViewer among PDOK's 3D BAG, beside a map of the clicked element's footprint."
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="intro">
        <h1>%VITE_SITE_TITLE%</h1>
        <p>
          The structural model of Sixty5, a tower at Strijp-S in Eindhoven. Read from IFC &amp;
          converted to geodata with
          <a href="https://github.com/bedrock-engineer/bimpolars">bimpolars</a>. Visualized in the
          <a href="https://github.com/bedrock-engineer/specklestuff">GeoSpeckleViewer</a>.
        </p>
      </div>
      <p class="how">
        <span class="action">Click a BIM element</span>
        <span>to see its footprint on the map</span>
        <span class="action">Shift-click to select multiple</span>
      </p>
    </header>
    <main class="panes">
      <section id="viewer-pane" class="pane" aria-label="3D view of the model">
        <div id="viewer"></div>
        <p id="loading" class="loading">Loading the structural model…</p>
      </section>
      <div
        id="splitter"
        class="splitter"
        role="separator"
        tabindex="0"
        aria-orientation="vertical"
        aria-controls="viewer-pane map-pane"
        aria-label="Width of the 3D view and the map"
        title="Drag to resize; double-click to reset"
      ></div>
      <section id="map-pane" class="pane" aria-label="Footprint map">
        <div id="map"></div>
        <div class="basemaps" role="group" aria-label="Basemap">
          <button type="button" data-basemap="topographic" aria-pressed="true">Topographic</button>
          <button type="button" data-basemap="aerial" aria-pressed="false">Aerial photo</button>
        </div>
        <!-- Empty, and so out of sight, until something is selected -->
        <aside id="selection" class="card" aria-live="polite" data-ids="[]" data-drawn="[]"></aside>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
