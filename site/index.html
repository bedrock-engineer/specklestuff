<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- From site/intro/<SITE>.html, filled in by vite.config.js: its h1 is the title, its
         intro the header's and its meta description the text that link previews show -->
    <title><!-- title --></title>
    <meta name="description" content="<!-- description -->" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="<!-- url -->" />
    <meta property="og:title" content="<!-- title -->" />
    <meta property="og:description" content="<!-- description -->" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="bar">
      <!-- Open beside each other, collapsed to the title when stacked: a tap opens it -->
      <details class="intro">
        <summary>
          <h1><!-- title --></h1>
        </summary>
        <!-- intro -->
      </details>
      <script>
        // Before the first paint, so that the intro neither flashes on a phone nor pops in
        {
          const intro = document.querySelector(".intro");
          const sideBySide = matchMedia("(min-width: 901px)");
          intro.open = sideBySide.matches;
          sideBySide.addEventListener("change", () => (intro.open = sideBySide.matches));
        }
      </script>
    </header>
    <main class="panes">
      <!-- The side-by-side layout's instructions, a sentence split where the panes are -->
      <p class="how how-click">Click a BIM element</p>
      <p class="how how-see">to see its footprint on the map</p>
      <p class="how how-shift">Shift-click to select multiple</p>
      <section id="viewer-pane" class="pane" aria-label="3D view of the model">
        <div id="viewer"></div>
        <p id="loading" class="loading">Loading the structural model…</p>
      </section>
      <div
        id="splitter"
        class="splitter"
        role="separator"
        tabindex="0"
        aria-orientation="vertical"
        aria-controls="viewer-pane map-pane"
        aria-label="Width of the 3D view and the map"
        title="Drag to resize; double-click to reset"
      ></div>
      <section id="map-pane" class="pane" aria-label="Footprint map">
        <div id="map"></div>
        <div class="basemaps" role="group" aria-label="Basemap">
          <button type="button" data-basemap="topographic" aria-pressed="true">Topographic</button>
          <button type="button" data-basemap="aerial" aria-pressed="false">Aerial photo</button>
        </div>
        <!-- Empty, and so out of sight, until something is selected -->
        <aside id="selection" class="card" aria-live="polite" data-ids="[]" data-drawn="[]"></aside>
      </section>
      <!-- The stacked layout's: the strip where a swipe scrolls the page, the panes take the
           touches for the camera and the map -->
      <aside class="rail">
        <p>Tap a BIM element to see its footprint on the map</p>
        <p>Swipe here to scroll</p>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
